<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120e22">
<title>RC Jogos</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f4ff;--card:#fff;--tx:#1b1630;--mu:#6b6585;--ac:#6d28d9;--bd:#ddd6f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120e22;--card:#1c1733;--tx:#f1eeff;--mu:#a69fc4;--ac:#a78bfa;--bd:#352d58}}
:root[data-theme="dark"]{--bg:#120e22;--card:#1c1733;--tx:#f1eeff;--mu:#a69fc4;--ac:#a78bfa;--bd:#352d58}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}body.lock{overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:16px;max-width:900px;margin:auto}
h1{margin:0;font-size:24px}main{max-width:900px;margin:auto;padding:0 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.cv{height:100px;display:flex;align-items:center;justify-content:center;font-size:42px;background-size:cover;background-position:center}
.cb{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}.cb b{overflow-wrap:anywhere}
.tag{font-size:12px;color:var(--ac)}.ds{font-size:13px;color:var(--mu)}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.on{background:var(--ac);color:#fff}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row.sp{margin-top:auto}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px;display:none}.panel.on{display:block}
input[type=text],textarea,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;margin:5px 0}
textarea{min-height:130px;font:13px monospace}.mu{color:var(--mu);font-size:14px}
#chips{margin:0 0 12px}#q{margin:0 0 8px}
#player{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:9}#player.on{display:flex}
#bar{display:flex;gap:6px;align-items:center;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:#120e22;color:#fff}
#bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
iframe{flex:1;border:0;width:100%;background:#fff;touch-action:none}
#pad{display:none;position:absolute;left:0;right:0;bottom:0;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));justify-content:space-between;pointer-events:none}
#pad.on{display:flex}#pad>div{display:grid;gap:6px;pointer-events:auto}
#dp{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}#ab{grid-template-columns:repeat(2,64px);align-self:end}
#pad button{background:rgba(109,40,217,.55);border:1px solid rgba(255,255,255,.4);padding:0;font-size:20px;touch-action:none;user-select:none;-webkit-user-select:none}
#rk{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}#rk.on{display:flex}
#rkb{background:var(--card);color:var(--tx);border-radius:14px;padding:16px;width:100%;max-width:380px;max-height:80vh;overflow:auto}
ol{padding-left:22px;margin:8px 0}
</style>
</head>
<body>
<header>
  <h1>🎮 RC Jogos</h1>
  <div class="row">
    <button id="addb">+ Adicionar jogo</button>
  </div>
</header>
<main>
<section class="panel" id="addp">
  <b>Novo jogo (Nuvem Google Drive)</b>
  <input type="text" id="nm" placeholder="Nome do jogo">
  <input type="text" id="ds" placeholder="Descrição curta (opcional)">
  <select id="ct"><option>Arcade</option><option>Corrida</option><option>Puzzle</option><option>Tiro</option><option>Plataforma</option><option>Outros</option></select>
  <textarea id="code" placeholder="Cole aqui o HTML completo do jogo…"></textarea>
  <div class="row">
    <input type="file" id="file" accept=".html,.htm,text/html" style="width:auto">
    <button id="test" class="g">▶ Testar agora</button>
    <button id="save">Salvar na Nuvem</button>
    <button class="g" id="cancel">Cancelar</button>
  </div>
  <p class="mu" id="msg">Ao salvar na nuvem, o jogo é gravado no Google Drive e fica visível para todos os jogadores.</p>
  <details>
    <summary class="mu">Prompt para pedir o jogo a qualquer IA</summary>
    <textarea id="pr" readonly="" style="min-height:130px"></textarea>
    <button class="g" id="cp">Copiar prompt</button>
  </details>
</section>

<input type="text" id="q" placeholder="🔍 Buscar jogo…">
<div id="chips" class="row">
  <button class="on">Todos</button><button class="g">★ Favoritos</button><button class="g">Arcade</button><button class="g">Corrida</button><button class="g">Puzzle</button><button class="g">Tiro</button><button class="g">Plataforma</button><button class="g">Outros</button>
</div>

<div id="list" class="grid"></div>
<p class="mu" id="empty" style="display: none;">A carregar jogos da nuvem ou nenhum encontrado...</p>
</main>

<!-- Emulador e Controles Móveis -->
<div id="player">
  <div id="bar">
    <span id="pt"></span>
    <button class="g" id="ctl">🎮 Controles</button>
    <button class="g" id="fs">⛶</button>
    <button id="close">Fechar</button>
  </div>
  <div style="position:relative;flex:1;display:flex">
    <iframe id="fr" sandbox="allow-scripts allow-pointer-lock allow-forms allow-modals" allow="fullscreen; gamepad"></iframe>
    <div id="pad">
      <div id="dp">
        <button data-k="ArrowUp" data-c="38" style="grid-area:1/2">▲</button>
        <button data-k="ArrowLeft" data-c="37" style="grid-area:2/1">◀</button>
        <button data-k="ArrowRight" data-c="39" style="grid-area:2/3">▶</button>
        <button data-k="ArrowDown" data-c="40" style="grid-area:3/2">▼</button>
      </div>
      <div id="ab">
        <button data-k="Enter" data-c="13">B</button>
        <button data-k=" " data-c="32">A</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal de Ranking -->
<div id="rk"><div id="rkb"></div></div>

<script>
// Endpoint do seu Google Apps Script conectado ao Drive
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwa0-tg8I_wS7L0anoHZfcZ3TCPe7GDMiYJ0CZeysPx59YU-D_j4ldfai_PmkZrW_L0/exec";

// Jogo fixo padrão caso a conexão falhe
const SEED = [
  {
    id: "builtin-starwars",
    name: "STAR WARS Galace",
    cat: "Tiro",
    desc: "Batalha espacial arcade cinematográfica.",
    builtin: true,
    html: `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#050713;color:#52f6ff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif}button{padding:10px 20px;font-weight:bold;background:#6d28d9;color:#fff;border:0;border-radius:8px;cursor:pointer}</style></head><body><h1>STAR WARS GALACE</h1><p>Missão espacial ativa.</p><button onclick="if(window.reportScore)window.reportScore(1500)">SIMULAR RECORDE (1500 PTS)</button></body></html>`
  }
];

const $ = id => document.getElementById(id);
const CATS = ["Arcade","Corrida","Puzzle","Tiro","Plataforma","Outros"];
const EMO = {Arcade:"🕹️", Corrida:"🏎️", Puzzle:"🧩", Tiro:"🚀", Plataforma:"🍄", Outros:"🎲"};
const PROMPT = "Crie um jogo arcade completo em UM ÚNICO arquivo HTML (HTML, CSS e JavaScript juntos, sem bibliotecas externas). Deve funcionar no celular (toque) e no computador (setas + espaço), usar canvas, ter placar, game over e botão de reiniciar. Ao terminar cada partida, chame window.reportScore(pontos) para enviar ao ranking. Responda apenas com o código dentro de um bloco de código.";
const INJ = '<script>(function(){window.reportScore=function(n){parent.postMessage({rc:"score",v:+n},"*")};addEventListener("message",function(e){var d=e.data;if(!d||d.rc!=="key")return;var ev=new KeyboardEvent(d.type,{key:d.key,code:d.code,bubbles:true});try{Object.defineProperty(ev,"keyCode",{get:function(){return d.kc}});Object.defineProperty(ev,"which",{get:function(){return d.kc}})}catch(x){}document.dispatchEvent(ev)})})()<\/script>';

$("pr").value = PROMPT;
$("ct").innerHTML = CATS.map(c=>`<option>${c}</option>`).join("");

const LS = (k,d) => { try{ return JSON.parse(localStorage.getItem(k)) ?? d } catch(e){ return d } };
const LSW = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)) } catch(e){} };

let cloudGames = [];
let scores = LS("rcjogos_scores", []);
let favs = LS("rcjogos_favs", []);
let cat = "Todos", cur = null, pad = false;

const hue = s => [...s].reduce((a,c)=>a*31+c.charCodeAt(0),7) % 360;

function getAllGames() {
  return [...cloudGames, ...SEED];
}

function chips() {
  const w = $("chips"); w.textContent = "";
  ["Todos","★ Favoritos",...CATS].forEach(c => {
    const b = document.createElement("button");
    b.textContent = c;
    b.className = cat === c ? "on" : "g";
    b.onclick = () => { cat = c; render(); };
    w.append(b);
  });
}

function render() {
  chips();
  const L = $("list"); L.textContent = "";
  const q = $("q").value.toLowerCase();
  const arr = getAllGames().filter(g => (cat==="Todos" || (cat==="★ Favoritos"?favs.includes(g.id):g.cat===cat)) && (g.name+" "+(g.desc||"")).toLowerCase().includes(q));
  
  $("empty").style.display = arr.length ? "none" : "block";

  arr.forEach(g => {
    const c = document.createElement("div"); c.className = "card";
    const cv = document.createElement("div"); cv.className = "cv";
    cv.style.background = `linear-gradient(135deg,hsl(${hue(g.name)},70%,45%),hsl(${(hue(g.name)+60)%360},70%,30%))`;
    cv.textContent = EMO[g.cat] || "🕹️";

    const b = document.createElement("div"); b.className = "cb";
    const n = document.createElement("b"); n.textContent = g.name;
    const t = document.createElement("div"); t.className = "tag"; t.textContent = g.cat || "Outros";
    const d = document.createElement("div"); d.className = "ds"; d.textContent = g.desc || "";
    const r = document.createElement("div"); r.className = "row sp";
    
    const mk = (x, f, cl) => {
      const e = document.createElement("button");
      e.textContent = x;
      if (cl) e.className = cl;
      e.onclick = f;
      r.append(e);
    };

    mk("Jogar", () => play(g));
    mk(favs.includes(g.id) ? "★" : "☆", () => fav(g.id), "g");
    mk("🏆", () => rank(g), "g");
    if (!g.builtin) {
      mk("🗑", () => del(g), "g");
    }

    b.append(n, t);
    if (g.desc) b.append(d);
    b.append(r);
    c.append(cv, b);
    L.append(c);
  });
}

function fav(id) {
  favs = favs.includes(id) ? favs.filter(x=>x!==id) : [...favs, id];
  LSW("rcjogos_favs", favs);
  render();
}

$("q").oninput = render;

function build(h) {
  return /<head[^>]*>/i.test(h) ? h.replace(/<head[^>]*>/i, m => m + INJ) : INJ + h;
}

function play(g) {
  cur = g;
  $("pt").textContent = g.name;
  $("fr").srcdoc = build(g.html);
  $("player").classList.add("on");
  document.body.classList.add("lock");
  pad = ("ontouchstart" in window);
  $("pad").classList.toggle("on", pad);
}

function closeP() {
  $("player").classList.remove("on");
  document.body.classList.remove("lock");
  $("fr").srcdoc = "";
  cur = null;
}

$("close").onclick = closeP;
$("fs").onclick = () => {
  const e = $("fr");
  (e.requestFullscreen || e.webkitRequestFullscreen || function(){}).call(e);
};
$("ctl").onclick = () => {
  pad = !pad;
  $("pad").classList.toggle("on", pad);
};

// Controles virtuais na tela
document.querySelectorAll("#pad button").forEach(b => {
  const s = t => {
    $("fr").contentWindow.postMessage({
      rc: "key",
      type: t,
      key: b.dataset.k,
      code: b.dataset.k === " " ? "Space" : b.dataset.k,
      kc: +b.dataset.c
    }, "*");
  };
  b.addEventListener("pointerdown", e => { e.preventDefault(); s("keydown"); });
  ["pointerup","pointercancel","pointerleave"].forEach(ev => b.addEventListener(ev, () => s("keyup")));
});

// Receptor de pontuações enviadas pelo jogo
addEventListener("message", e => {
  const d = e.data;
  if (cur && e.source === $("fr").contentWindow && d && d.rc === "score") {
    saveScore(cur, Math.floor(d.v));
  }
});

function saveScore(g, v) {
  if (!isFinite(v) || v <= 0) return;
  let name = prompt(`🏆 Novo recorde no jogo ${g.name}!\nPontos: ${v}\nDigite seu Apelido / Nick:`);
  name = (name || "").trim().slice(0, 20) || "Jogador Anônimo";
  
  scores.push({ gid: g.id, name: name, best: v, t: Date.now() });
  scores.sort((a,b) => b.best - a.best);
  LSW("rcjogos_scores", scores);

  // Envia pontuação também para a nuvem
  fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: 'salvar_score',
      gameId: g.id,
      gameTitle: g.name,
      player: name,
      score: v
    })
  }).catch(()=>{});

  alert("Pontuação registrada com sucesso!");
}

function rank(g) {
  const top = scores.filter(s => s.gid === g.id).sort((a,b) => b.best - a.best).slice(0, 10);
  const b = $("rkb"); b.textContent = "";
  const h = document.createElement("b"); h.textContent = "🏆 " + g.name; b.append(h);

  if (!top.length) {
    const p = document.createElement("p"); p.className = "mu"; p.textContent = "Sem pontuações ainda. Jogue e seja o primeiro!";
    b.append(p);
  } else {
    const o = document.createElement("ol");
    top.forEach(s => {
      const l = document.createElement("li");
      l.textContent = s.name + " — " + s.best + " pts";
      o.append(l);
    });
    b.append(o);
  }

  const x = document.createElement("button");
  x.textContent = "Fechar";
  x.onclick = () => $("rk").classList.remove("on");
  b.append(x);
  $("rk").classList.add("on");
}

$("rk").onclick = e => { if (e.target === $("rk")) $("rk").classList.remove("on"); };

$("addb").onclick = () => $("addp").classList.toggle("on");
$("cancel").onclick = () => $("addp").classList.remove("on");

$("cp").onclick = async () => {
  try {
    await navigator.clipboard.writeText(PROMPT);
    $("cp").textContent = "Copiado!";
    setTimeout(() => $("cp").textContent = "Copiar prompt", 2000);
  } catch(e) {
    $("pr").select();
  }
};

$("file").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  $("code").value = await f.text();
  if (!$("nm").value) $("nm").value = f.name.replace(/\.html?$/i, "");
};

// Testar instantaneamente na tela sem salvar
$("test").onclick = () => {
  const h = $("code").value.trim();
  if (h.length < 20) { $("msg").textContent = "Cole o código HTML primeiro."; return; }
  cur = { id: "test", name: $("nm").value || "Teste Local", html: h };
  play(cur);
};

// ---------------- SINCRONIZAÇÃO NUVEM GOOGLE DRIVE ----------------

// Carregar jogos do Google Drive
async function carregarJogosNuvem() {
  try {
    const res = await fetch(SCRIPT_URL + "?action=listar");
    const data = await res.json();
    if (data.sucesso && Array.isArray(data.jogos)) {
      cloudGames = data.jogos.map(j => ({
        id: j.id,
        name: j.title,
        cat: j.category || "Arcade",
        desc: j.desc || "",
        html: j.code,
        builtin: false
      }));
      render();
    }
  } catch (err) {
    console.warn("Falha ao comunicar com o Google Drive:", err);
  }
}

// Salvar jogo no Google Drive
$("save").onclick = async () => {
  const name = $("nm").value.trim(), html = $("code").value.trim();
  if (!name || html.length < 20) { $("msg").textContent = "Informe o nome e o código HTML."; return; }

  const btn = $("save");
  btn.disabled = true;
  btn.textContent = "A enviar à nuvem...";

  const safeFileName = name.toLowerCase().replace(/[^a-z0-9]/g, '_') + '.html';
  const base64Content = 'data:text/html;charset=utf-8,' + encodeURIComponent(html);

  const payload = {
    nome: safeFileName,
    tipoMime: 'text/html',
    conteudo: base64Content,
    titulo: name,
    autor: 'Dev',
    categoria: $("ct").value,
    desc: $("ds").value.trim().slice(0, 90)
  };

  try {
    const response = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    const res = await response.json();
    btn.disabled = false;
    btn.textContent = "Salvar na Nuvem";

    if (res.sucesso) {
      alert("Sucesso: Jogo arquivado no Google Drive! Já está disponível para todos os jogadores.");
      ["nm","ds","code","file"].forEach(k => $(k).value = "");
      $("addp").classList.remove("on");
      carregarJogosNuvem();
    } else {
      alert("Erro ao gravar no Drive: " + res.mensagem);
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "Salvar na Nuvem";
    alert("Erro de conexão com o Apps Script.");
  }
};

// Excluir jogo do Google Drive
async function del(g) {
  if (!confirm("Excluir o jogo \"" + g.name + "\" da nuvem de todos os aparelhos?")) return;
  
  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'excluir', id: g.id })
    });
    const data = await res.json();
    if (data.sucesso) {
      alert("Jogo excluído com sucesso da nuvem!");
      carregarJogosNuvem();
    } else {
      alert("Erro ao excluir: " + data.mensagem);
    }
  } catch (err) {
    alert("Erro de comunicação com o servidor.");
  }
}

// Inicializar interface e puxar jogos da nuvem
render();
carregarJogosNuvem();

// Registrar Service Worker para PWA
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => console.log("SW:", err));
  });
}
</script>
</body>
</html>
