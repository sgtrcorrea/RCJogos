<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120e22">
<title>RC Jogos</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f4ff;--card:#fff;--tx:#1b1630;--mu:#6b6585;--ac:#6d28d9;--bd:#ddd6f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120e22;--card:#1c1733;--tx:#f1eeff;--mu:#a69fc4;--ac:#a78bfa;--bd:#352d58}}
:root[data-theme="dark"]{--bg:#120e22;--card:#1c1733;--tx:#f1eeff;--mu:#a69fc4;--ac:#a78bfa;--bd:#352d58}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}body.lock{overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:16px;max-width:900px;margin:auto}
h1{margin:0;font-size:24px}main{max-width:900px;margin:auto;padding:0 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.cv{height:100px;display:flex;align-items:center;justify-content:center;font-size:42px;background-size:cover;background-position:center}
.cb{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}.cb b{overflow-wrap:anywhere}
.tag{font-size:12px;color:var(--ac)}.ds{font-size:13px;color:var(--mu)}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.on{background:var(--ac);color:#fff}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row.sp{margin-top:auto}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px;display:none}.panel.on{display:block}
input[type=text],textarea,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;margin:5px 0}
textarea{min-height:130px;font:13px monospace}.mu{color:var(--mu);font-size:14px}
#chips{margin:0 0 12px}#q{margin:0 0 8px}
#player{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:9}#player.on{display:flex}
#bar{display:flex;gap:6px;align-items:center;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:#120e22;color:#fff}
#bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
iframe{flex:1;border:0;width:100%;background:#fff;touch-action:none}
#pad{display:none;position:absolute;left:0;right:0;bottom:0;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));justify-content:space-between;pointer-events:none}
#pad.on{display:flex}#pad>div{display:grid;gap:6px;pointer-events:auto}
#dp{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}#ab{grid-template-columns:repeat(2,64px);align-self:end}
#pad button{background:rgba(109,40,217,.55);border:1px solid rgba(255,255,255,.4);padding:0;font-size:20px;touch-action:none;user-select:none;-webkit-user-select:none}
#rk{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}#rk.on{display:flex}
#rkb{background:var(--card);color:var(--tx);border-radius:14px;padding:16px;width:100%;max-width:380px;max-height:80vh;overflow:auto}
ol{padding-left:22px;margin:8px 0}
</style>
</head>
<body>
<header>
  <h1>🎮 RC Jogos</h1>
  <div class="row">
    <button id="addb">+ Adicionar jogo</button>
  </div>
</header>
<main>
<section class="panel" id="addp">
  <b>Novo jogo (Dev Studio)</b>
  <input type="text" id="nm" placeholder="Nome do jogo">
  <input type="text" id="ds" placeholder="Descrição curta (opcional)">
  <select id="ct"><option>Arcade</option><option>Corrida</option><option>Puzzle</option><option>Tiro</option><option>Plataforma</option><option>Outros</option></select>
  <label class="mu">Capa (opcional): <input type="file" id="cvf" accept="image/*"></label>
  <textarea id="code" placeholder="Cole aqui o HTML completo do jogo…"></textarea>
  <div class="row">
    <input type="file" id="file" accept=".html,.htm,text/html" style="width:auto">
    <button id="test" class="g">▶ Testar agora</button>
    <button id="save">Salvar jogo</button>
    <button class="g" id="cancel">Cancelar</button>
  </div>
  <p class="mu" id="msg">Arquivo HTML único (com CSS e JS dentro). Cole o código e use "Testar agora" para rodar imediatamente.</p>
  <details>
    <summary class="mu">Prompt para pedir o jogo a qualquer IA</summary>
    <textarea id="pr" readonly="" style="min-height:130px"></textarea>
    <button class="g" id="cp">Copiar prompt</button>
  </details>
</section>

<input type="text" id="q" placeholder="🔍 Buscar jogo…">
<div id="chips" class="row">
  <button class="on">Todos</button><button class="g">★ Favoritos</button><button class="g">Arcade</button><button class="g">Corrida</button><button class="g">Puzzle</button><button class="g">Tiro</button><button class="g">Plataforma</button><button class="g">Outros</button>
</div>

<div id="list" class="grid"></div>
<p class="mu" id="empty" style="display: none;">Nenhum jogo encontrado.</p>
</main>

<!-- Emulador e Controles -->
<div id="player">
  <div id="bar">
    <span id="pt"></span>
    <button class="g" id="ctl">🎮 Controles</button>
    <button class="g" id="fs">⛶</button>
    <button id="close">Fechar</button>
  </div>
  <div style="position:relative;flex:1;display:flex">
    <iframe id="fr" sandbox="allow-scripts allow-pointer-lock allow-forms allow-modals" allow="fullscreen; gamepad"></iframe>
    <div id="pad">
      <div id="dp">
        <button data-k="ArrowUp" data-c="38" style="grid-area:1/2">▲</button>
        <button data-k="ArrowLeft" data-c="37" style="grid-area:2/1">◀</button>
        <button data-k="ArrowRight" data-c="39" style="grid-area:2/3">▶</button>
        <button data-k="ArrowDown" data-c="40" style="grid-area:3/2">▼</button>
      </div>
      <div id="ab">
        <button data-k="Enter" data-c="13">B</button>
        <button data-k=" " data-c="32">A</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal de Ranking -->
<div id="rk"><div id="rkb"></div></div>

<script>
// Jogo inicial embutido (Star Wars Galactic Ace)
const SEED = [
  {
    "id": "g_starwars",
    "name": "STAR WARS Galace",
    "cat": "Tiro",
    "desc": "Batalha espacial arcade cinematográfica.",
    "t": 1792249138278,
    "html": `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050712">
<title>Galactic Ace</title>
<style>
:root{color-scheme:dark;--cyan:#52f6ff;--blue:#377dff;--pink:#ff386b;--gold:#ffc857;--panel:rgba(7,12,30,.94)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03040b;color:#f4f7ff;font-family:system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;touch-action:manipulation}
#game-container{position:relative;width:min(100vw,560px);height:100dvh;max-height:1000px;margin:auto;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#101d43 0%,#050817 48%,#02030a 100%);isolation:isolate}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0 0 auto;z-index:5;padding:max(12px,env(safe-area-inset-top)) 14px 0;display:flex;justify-content:space-between;pointer-events:none;gap:12px;text-shadow:0 2px 5px #000}
.hud-col{display:flex;flex-direction:column;gap:5px;min-width:120px}.hud-col.right{align-items:flex-end;text-align:right}
.hud-label{font-size:10px;letter-spacing:1.5px;color:#aab8d8;font-weight:800}.hud-value{font-size:15px;font-weight:900}
.bar{width:clamp(100px,32vw,150px);height:7px;border:1px solid #ffffff44;background:#ffffff1b;border-radius:99px;overflow:hidden}.fill{height:100%;width:100%;transition:width .12s linear;background:linear-gradient(90deg,#ff386b,#ffb34f)}#special-fill{background:linear-gradient(90deg,#37dfff,#7e8bff)}
#mobile-controls{position:absolute;z-index:6;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 16px;pointer-events:none}
.control-cluster{display:flex;gap:10px;align-items:flex-end}
.control-btn{pointer-events:auto;width:clamp(56px,15vw,70px);height:clamp(56px,15vw,70px);border-radius:50%;border:1px solid #58eaffaa;background:radial-gradient(circle at 35% 25%,#3e9bcb77,#08152bd9 72%);color:#dffcff;font-weight:900;font-size:10px;display:grid;place-items:center;user-select:none}
.control-btn.pink{border-color:#ff5688aa;color:#ffdce7;background:radial-gradient(circle at 35% 25%,#b3325d77,#260a20e8 72%)}
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:rgba(3,5,15,.92);backdrop-filter:blur(10px)}
.logo{font-size:36px;font-weight:900;color:#52f6ff;margin:0 0 10px;text-transform:uppercase}
.btn{border:1px solid #66f5ff8c;color:#f3ffff;background:linear-gradient(110deg,#0876b9,#1749a9);padding:12px 24px;border-radius:12px;font-weight:900;font-size:13px;cursor:pointer;margin:6px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  <div id="hud" class="hidden">
    <div class="hud-col">
      <div class="hud-label">ESCUDO</div>
      <div class="hud-value"><span id="hud-hp">100</span> HP</div>
      <div class="bar"><div id="hp-fill" class="fill"></div></div>
      <div class="hud-label" style="margin-top:3px">ALVOS <span id="hud-kills">0 / 15</span></div>
    </div>
    <div class="hud-col right">
      <div class="hud-label">SETOR <span id="hud-wave" style="color:#fff">01</span></div>
      <div class="hud-value" style="color:var(--gold)">PTS <span id="hud-score">0</span></div>
      <div class="hud-label">BOMBAS: <span id="hud-bombs">2</span></div>
    </div>
  </div>
  <div id="mobile-controls" class="hidden">
    <div class="control-cluster">
      <button class="control-btn" id="btn-special">✦<br><small>RAIO</small></button>
      <button class="control-btn pink" id="btn-bomb">✹<br><small>BOMBA</small></button>
    </div>
  </div>
  <section id="menu-screen" class="screen">
    <h1 class="logo">GALACTIC ACE</h1>
    <p style="color:#aab8d8;font-size:13px;max-width:320px;margin-bottom:20px">Defenda a galáxia. Destrua as naves inimigas e dispute o topo do ranking!</p>
    <button class="btn" id="start-btn">▶ INICIAR MISSÃO</button>
  </section>
  <section id="over-screen" class="screen hidden">
    <h1 class="logo" style="color:#ff386b">FIM DE JOGO</h1>
    <p style="font-size:18px;margin:5px 0">Pontos: <b id="final-score" style="color:#ffd36b">0</b></p>
    <button class="btn" id="retry-btn">↻ JOGAR NOVAMENTE</button>
  </section>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('gameCanvas'), ctx = canvas.getContext('2d');
  let W=480, H=850, player={x:240,y:720,hp:100,maxHp:100}, score=0, wave=1, kills=0, target=15, bombs=2;
  let bullets=[], enemies=[], particles=[], state='MENU', lastTime=0, spawnTimer=0;
  const keys={};
  
  function resize(){
    const r=$('game-container').getBoundingClientRect();
    W=canvas.width=r.width; H=canvas.height=r.height;
    player.x=W/2; player.y=H*0.82;
  }
  window.addEventListener('resize', resize);
  resize();

  function startGame(){
    score=0; wave=1; kills=0; target=15; bombs=2; player.hp=100;
    bullets=[]; enemies=[]; particles=[]; state='PLAY';
    $('menu-screen').classList.add('hidden');
    $('over-screen').classList.add('hidden');
    $('hud').classList.remove('hidden');
    $('mobile-controls').classList.remove('hidden');
    lastTime=performance.now();
  }

  function gameOver(){
    state='OVER';
    $('final-score').textContent = score;
    $('hud').classList.add('hidden');
    $('mobile-controls').classList.add('hidden');
    $('over-screen').classList.remove('hidden');
    // Envia a pontuação para a plataforma RC Jogos
    if(window.reportScore) window.reportScore(score);
  }

  window.addEventListener('keydown', e=>{ keys[e.code]=true; if(e.code==='Space') useSpecial(); if(e.code==='KeyE') useBomb(); });
  window.addEventListener('keyup', e=>{ keys[e.code]=false; });

  canvas.addEventListener('pointermove', e=>{
    if(state!=='PLAY') return;
    const r=canvas.getBoundingClientRect();
    player.x=e.clientX-r.left;
    player.y=e.clientY-r.top;
  });

  function useSpecial(){
    if(state!=='PLAY') return;
    for(let i=-2; i<=2; i++) bullets.push({x:player.x, y:player.y-20, vx:i*70, vy:-600, r:4});
  }
  function useBomb(){
    if(state!=='PLAY' || bombs<=0) return;
    bombs--;
    enemies.forEach(e=>score+=100);
    enemies=[];
  }
  $('btn-special').onclick=useSpecial;
  $('btn-bomb').onclick=useBomb;
  $('start-btn').onclick=startGame;
  $('retry-btn').onclick=startGame;

  let shotTimer=0;
  function update(dt){
    if(state!=='PLAY') return;
    if(keys.ArrowLeft || keys.KeyA) player.x -= 300*dt;
    if(keys.ArrowRight || keys.KeyD) player.x += 300*dt;
    if(keys.ArrowUp || keys.KeyW) player.y -= 300*dt;
    if(keys.ArrowDown || keys.KeyS) player.y += 300*dt;
    player.x = Math.max(20, Math.min(W-20, player.x));
    player.y = Math.max(40, Math.min(H-40, player.y));

    shotTimer += dt;
    if(shotTimer > 0.16){
      shotTimer = 0;
      bullets.push({x:player.x, y:player.y-20, vx:0, vy:-550, r:3.5});
    }

    spawnTimer -= dt;
    if(spawnTimer <= 0){
      spawnTimer = Math.max(0.35, 1.0 - wave*0.05);
      enemies.push({x:30+Math.random()*(W-60), y:-20, vy:120+wave*15, hp:2});
    }

    for(let i=bullets.length-1; i>=0; i--){
      const b=bullets[i]; b.x+=(b.vx||0)*dt; b.y+=b.vy*dt;
      if(b.y < -10) { bullets.splice(i,1); continue; }
      for(let j=enemies.length-1; j>=0; j--){
        const e=enemies[j];
        if(Math.hypot(b.x-e.x, b.y-e.y) < 22){
          e.hp--; bullets.splice(i,1);
          if(e.hp<=0){
            enemies.splice(j,1); score += 100; kills++;
            if(kills >= target){ wave++; target += 5; kills=0; }
          }
          break;
        }
      }
    }

    for(let i=enemies.length-1; i>=0; i--){
      const e=enemies[i]; e.y += e.vy*dt;
      if(Math.hypot(e.x-player.x, e.y-player.y) < 25){
        enemies.splice(i,1); player.hp -= 20;
        if(player.hp <= 0) gameOver();
      } else if(e.y > H+30) enemies.splice(i,1);
    }

    $('hud-hp').textContent = Math.max(0, player.hp);
    $('hp-fill').style.width = (player.hp)+'percent'.replace('percent','%');
    $('hud-score').textContent = score;
    $('hud-kills').textContent = kills + ' / ' + target;
    $('hud-wave').textContent = String(wave).padStart(2,'0');
    $('hud-bombs').textContent = bombs;
  }

  function render(){
    ctx.fillStyle = '#050713';
    ctx.fillRect(0,0,W,H);

    // Nave do jogador
    if(state==='PLAY'){
      ctx.fillStyle = '#52f6ff';
      ctx.beginPath();
      ctx.moveTo(player.x, player.y-20);
      ctx.lineTo(player.x-16, player.y+15);
      ctx.lineTo(player.x+16, player.y+15);
      ctx.closePath();
      ctx.fill();
    }

    // Tiros
    ctx.fillStyle = '#37dfff';
    bullets.forEach(b => {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    });

    // Inimigos
    ctx.fillStyle = '#ff386b';
    enemies.forEach(e => {
      ctx.beginPath();
      ctx.arc(e.x, e.y, 14, 0, Math.PI*2);
      ctx.fill();
    });
  }

  function loop(now){
    const dt = Math.min(0.04, (now-lastTime)/1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
<\/script>
</body>
</html>`
  }
];

const $ = id => document.getElementById(id);
const CATS = ["Arcade","Corrida","Puzzle","Tiro","Plataforma","Outros"];
const EMO = {Arcade:"🕹️", Corrida:"🏎️", Puzzle:"🧩", Tiro:"🚀", Plataforma:"🍄", Outros:"🎲"};
const PROMPT = "Crie um jogo arcade completo em UM ÚNICO arquivo HTML (HTML, CSS e JavaScript juntos, sem bibliotecas externas). Deve funcionar no celular (toque) e no computador (setas + espaço), usar canvas, ter placar, game over e botão de reiniciar. Ao terminar cada partida, chame window.reportScore(pontos) para enviar ao ranking. Responda apenas com o código dentro de um bloco de código.";
const INJ = '<script>(function(){window.reportScore=function(n){parent.postMessage({rc:"score",v:+n},"*")};addEventListener("message",function(e){var d=e.data;if(!d||d.rc!=="key")return;var ev=new KeyboardEvent(d.type,{key:d.key,code:d.code,bubbles:true});try{Object.defineProperty(ev,"keyCode",{get:function(){return d.kc}});Object.defineProperty(ev,"which",{get:function(){return d.kc}})}catch(x){}document.dispatchEvent(ev)})})()<\/script>';

$("pr").value = PROMPT;
$("ct").innerHTML = CATS.map(c=>`<option>${c}</option>`).join("");

const LS = (k,d) => { try{ return JSON.parse(localStorage.getItem(k)) ?? d } catch(e){ return d } };
const LSW = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)) } catch(e){} };

let savedGames = LS("rcjogos_games", []);
let games = savedGames.length ? savedGames : SEED.slice();
let scores = LS("rcjogos_scores", []);
let favs = LS("rcjogos_favs", []);
let cat = "Todos", cur = null, pad = false;

const hue = s => [...s].reduce((a,c)=>a*31+c.charCodeAt(0),7) % 360;

function chips() {
  const w = $("chips"); w.textContent = "";
  ["Todos","★ Favoritos",...CATS].forEach(c => {
    const b = document.createElement("button");
    b.textContent = c;
    b.className = cat === c ? "on" : "g";
    b.onclick = () => { cat = c; render(); };
    w.append(b);
  });
}

function render() {
  chips();
  const L = $("list"); L.textContent = "";
  const q = $("q").value.toLowerCase();
  const arr = games.filter(g => (cat==="Todos" || (cat==="★ Favoritos"?favs.includes(g.id):g.cat===cat)) && (g.name+" "+(g.desc||"")).toLowerCase().includes(q)).sort((a,b)=>(b.t||0)-(a.t||0));
  
  $("empty").style.display = arr.length ? "none" : "block";

  arr.forEach(g => {
    const c = document.createElement("div"); c.className = "card";
    const cv = document.createElement("div"); cv.className = "cv";
    if (g.cover) {
      cv.style.backgroundImage = "url("+g.cover+")";
    } else {
      cv.style.background = `linear-gradient(135deg,hsl(${hue(g.name)},70%,45%),hsl(${(hue(g.name)+60)%360},70%,30%))`;
      cv.textContent = EMO[g.cat] || "🕹️";
    }
    const b = document.createElement("div"); b.className = "cb";
    const n = document.createElement("b"); n.textContent = g.name;
    const t = document.createElement("div"); t.className = "tag"; t.textContent = g.cat || "Outros";
    const d = document.createElement("div"); d.className = "ds"; d.textContent = g.desc || "";
    const r = document.createElement("div"); r.className = "row sp";
    
    const mk = (x, f, cl) => {
      const e = document.createElement("button");
      e.textContent = x;
      if (cl) e.className = cl;
      e.onclick = f;
      r.append(e);
    };

    mk("Jogar", () => play(g));
    mk(favs.includes(g.id) ? "★" : "☆", () => fav(g.id), "g");
    mk("🏆", () => rank(g), "g");
    mk("🗑", () => del(g), "g");

    b.append(n, t);
    if (g.desc) b.append(d);
    b.append(r);
    c.append(cv, b);
    L.append(c);
  });
}

function fav(id) {
  favs = favs.includes(id) ? favs.filter(x=>x!==id) : [...favs, id];
  LSW("rcjogos_favs", favs);
  render();
}

$("q").oninput = render;

function build(h) {
  return /<head[^>]*>/i.test(h) ? h.replace(/<head[^>]*>/i, m => m + INJ) : INJ + h;
}

function play(g) {
  cur = g;
  $("pt").textContent = g.name;
  $("fr").srcdoc = build(g.html);
  $("player").classList.add("on");
  document.body.classList.add("lock");
  pad = ("ontouchstart" in window);
  $("pad").classList.toggle("on", pad);
}

function closeP() {
  $("player").classList.remove("on");
  document.body.classList.remove("lock");
  $("fr").srcdoc = "";
  cur = null;
}

$("close").onclick = closeP;
$("fs").onclick = () => {
  const e = $("fr");
  (e.requestFullscreen || e.webkitRequestFullscreen || function(){}).call(e);
};
$("ctl").onclick = () => {
  pad = !pad;
  $("pad").classList.toggle("on", pad);
};

// Controles virtuais (D-Pad)
document.querySelectorAll("#pad button").forEach(b => {
  const s = t => {
    $("fr").contentWindow.postMessage({
      rc: "key",
      type: t,
      key: b.dataset.k,
      code: b.dataset.k === " " ? "Space" : b.dataset.k,
      kc: +b.dataset.c
    }, "*");
  };
  b.addEventListener("pointerdown", e => { e.preventDefault(); s("keydown"); });
  ["pointerup","pointercancel","pointerleave"].forEach(ev => b.addEventListener(ev, () => s("keyup")));
});

// Receptor de pontuação
addEventListener("message", e => {
  const d = e.data;
  if (cur && e.source === $("fr").contentWindow && d && d.rc === "score") {
    saveScore(cur, Math.floor(d.v));
  }
});

function saveScore(g, v) {
  if (!isFinite(v) || v <= 0) return;
  let name = prompt(`🏆 Novo recorde no jogo ${g.name}!\nVocê fez ${v} pontos.\nDigite seu Nick:`);
  name = (name || "").trim().slice(0, 20) || "Jogador Anônimo";
  
  scores.push({ gid: g.id, name: name, best: v, t: Date.now() });
  scores.sort((a,b) => b.best - a.best);
  LSW("rcjogos_scores", scores);
  alert("Pontuação gravada no Hall da Fama!");
}

function rank(g) {
  const top = scores.filter(s => s.gid === g.id).sort((a,b) => b.best - a.best).slice(0, 10);
  const b = $("rkb"); b.textContent = "";
  const h = document.createElement("b"); h.textContent = "🏆 " + g.name; b.append(h);

  if (!top.length) {
    const p = document.createElement("p"); p.className = "mu"; p.textContent = "Sem pontuações ainda. Jogue e seja o primeiro!";
    b.append(p);
  } else {
    const o = document.createElement("ol");
    top.forEach(s => {
      const l = document.createElement("li");
      l.textContent = s.name + " — " + s.best + " pts";
      o.append(l);
    });
    b.append(o);
  }

  const x = document.createElement("button");
  x.textContent = "Fechar";
  x.onclick = () => $("rk").classList.remove("on");
  b.append(x);
  $("rk").classList.add("on");
}

$("rk").onclick = e => { if (e.target === $("rk")) $("rk").classList.remove("on"); };

$("addb").onclick = () => $("addp").classList.toggle("on");
$("cancel").onclick = () => $("addp").classList.remove("on");

$("cp").onclick = async () => {
  try {
    await navigator.clipboard.writeText(PROMPT);
    $("cp").textContent = "Copiado!";
    setTimeout(() => $("cp").textContent = "Copiar prompt", 2000);
  } catch(e) {
    $("pr").select();
  }
};

$("file").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  $("code").value = await f.text();
  if (!$("nm").value) $("nm").value = f.name.replace(/\.html?$/i, "");
};

// Testar instantâneo
$("test").onclick = () => {
  const h = $("code").value.trim();
  if (h.length < 20) { $("msg").textContent = "Cole o código HTML primeiro."; return; }
  cur = { id: "test", name: $("nm").value || "Teste Local", html: h };
  play(cur);
};

// Salvar jogo
$("save").onclick = () => {
  const name = $("nm").value.trim(), html = $("code").value.trim();
  if (!name || html.length < 20) { $("msg").textContent = "Informe o nome e o código HTML."; return; }

  const t = Date.now(), id = "g" + t;
  const g = { id, name, html, t, cat: $("ct").value, desc: $("ds").value.trim().slice(0, 90) };
  
  games.unshift(g);
  LSW("rcjogos_games", games);
  render();

  ["nm","ds","code","file"].forEach(k => $(k).value = "");
  $("addp").classList.remove("on");
  $("msg").textContent = "Jogo salvo com sucesso!";
};

// Excluir jogo
function del(g) {
  if (!confirm("Excluir o jogo \"" + g.name + "\"?")) return;
  games = games.filter(x => x.id !== g.id);
  LSW("rcjogos_games", games);
  render();
}

// Inicialização
render();

// Registro do Service Worker (PWA)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => console.log("SW:", err));
  });
}
</script>
</body>
</html>
