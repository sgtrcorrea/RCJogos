class AudioEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  playTone(step) {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.frequency.setValueAtTime(this.notes[step % this.notes.length], this.ctx.currentTime);
    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.12);
  }
  playVictory() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + (idx * 0.08));
      gain.gain.setValueAtTime(0.1, this.ctx.currentTime + (idx * 0.08));
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + (idx * 0.08) + 0.35);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + (idx * 0.08));
      osc.stop(this.ctx.currentTime + (idx * 0.08) + 0.35);
    });
  }
}

  paths = {};
  completedColors.clear();
  isDrawing = false;
  activeColor = null;

  const unique = [...new Set(level.dots.map(d => d.color))];
  unique.forEach(c => { paths[c] = []; });

  document.getElementById('winModal').classList.remove('active');
  document.getElementById('tierTag').textContent = "Nível " + (currentLvl + 1) + " • " + level.tier;
  updateUI();
  render();
}

function getCell(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = LOGICAL_RESOLUTION / rect.width;
  const scaleY = LOGICAL_RESOLUTION / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const x = (clientX - rect.left) * scaleX;
  const y = (clientY - rect.top) * scaleY;
  const cellSize = LOGICAL_RESOLUTION / gridSize;
  const c = Math.floor(x / cellSize);
  const r = Math.floor(y / cellSize);
  if (r >= 0 && r < gridSize && c >= 0 && c < gridSize) return { r, c };
  return null;
}

function getDotAt(r, c) {
  return LEVELS[currentLvl].dots.find(d => d.r === r && d.c === c) || null;
}

function isAdjacent(a, b) {
  const dr = Math.abs(a.r - b.r);
  const dc = Math.abs(a.c - b.c);
  return (dr === 1 && dc === 0) || (dr === 0 && dc === 1);
}

canvas.addEventListener('pointerdown', (e) => {
  sound.init();
  canvas.setPointerCapture(e.pointerId);
  const cell = getCell(e);
  if (!cell) return;
  const dot = getDotAt(cell.r, cell.c);
  if (dot) {
    activeColor = dot.color;
    isDrawing = true;
    paths[activeColor] = [{ r: cell.r, c: cell.c }];
    completedColors.delete(activeColor);
    sound.playTone(1);
  } else {
    for (const [colStr, path] of Object.entries(paths)) {
      const cId = parseInt(colStr);
      const idx = path.findIndex(p => p.r === cell.r && p.c === cell.c);
      if (idx !== -1) {
        activeColor = cId;
        isDrawing = true;
        paths[activeColor] = path.slice(0, idx + 1);
        completedColors.delete(activeColor);
        sound.playTone(idx + 1);
        break;
      }
    }
  }
  updateUI();
  render();
});

canvas.addEventListener('pointermove', (e) => {
  if (!isDrawing || !activeColor) return;
  const cell = getCell(e);
  if (!cell) return;
  const curPath = paths[activeColor];
  const last = curPath[curPath.length - 1];
  if (cell.r === last.r && cell.c === last.c) return;
  if (!isAdjacent(cell, last)) return;

  if (curPath.length > 1) {
    const prev = curPath[curPath.length - 2];
    if (cell.r === prev.r && cell.c === prev.c) {
      curPath.pop();
      completedColors.delete(activeColor);
      sound.playTone(curPath.length);
      updateUI();
      render();
      return;
    }
  }

  if (completedColors.has(activeColor)) return;
  const targetDot = getDotAt(cell.r, cell.c);
  if (targetDot && targetDot.color !== activeColor) return;

  if (targetDot && targetDot.color === activeColor) {
    const startDot = curPath[0];
    if (startDot.r !== cell.r || startDot.c !== cell.c) {
      curPath.push({ r: cell.r, c: cell.c });
      completedColors.add(activeColor);
      isDrawing = false;
      sound.playTone(7);
      checkVictory();
      updateUI();
      render();
      return;
    }
  }

  const selfIdx = curPath.findIndex(p => p.r === cell.r && p.c === cell.c);
  if (selfIdx !== -1) {
    paths[activeColor] = curPath.slice(0, selfIdx + 1);
    updateUI();
    render();
    return;
  }

  for (const [otherStr, otherPath] of Object.entries(paths)) {
    const oId = parseInt(otherStr);
    if (oId !== activeColor) {
      const cutIdx = otherPath.findIndex(p => p.r === cell.r && p.c === cell.c);
      if (cutIdx !== -1) {
        paths[oId] = otherPath.slice(0, cutIdx);
        completedColors.delete(oId);
      }
    }
  }

  curPath.push({ r: cell.r, c: cell.c });
  sound.playTone(curPath.length);
  updateUI();
  render();
});

function stopDrawing(e) {
  if (isDrawing) {
    isDrawing = false;
    activeColor = null;
    if (e && e.pointerId && canvas.hasPointerCapture(e.pointerId)) {
      canvas.releasePointerCapture(e.pointerId);
    }
    render();
  }
}
canvas.addEventListener('pointerup', stopDrawing);
canvas.addEventListener('pointercancel', stopDrawing);

function checkVictory() {
  const level = LEVELS[currentLvl];
  const uniqueColors = new Set(level.dots.map(d => d.color));
  const allConnected = uniqueColors.size === completedColors.size;

  let filled = 0;
  for (const p of Object.values(paths)) filled += p.length;
  const fullGrid = filled >= (gridSize * gridSize);

  if (allConnected && fullGrid) {
    setTimeout(() => {
      sound.playVictory();
      const levelScore = (currentLvl + 1) * 250;
      totalCumulativeScore += levelScore;
      
      // Comunicação nativa com o Ranking da plataforma RC Jogos
      if (window.reportScore) {
        window.reportScore(totalCumulativeScore);
      }

      document.getElementById('winScoreTxt').textContent = "Recorde total acumulado: " + totalCumulativeScore + " pts!";
      document.getElementById('winModal').classList.add('active');
    }, 150);
  }
}

function updateUI() {
  const level = LEVELS[currentLvl];
  const uniqueColors = new Set(level.dots.map(d => d.color));
  document.getElementById('levelVal').textContent = (currentLvl + 1) + "/" + LEVELS.length;
  document.getElementById('gridVal').textContent = gridSize + "×" + gridSize;
  document.getElementById('flowVal').textContent = completedColors.size + "/" + uniqueColors.size;

  let filled = 0;
  for (const p of Object.values(paths)) filled += p.length;
  const pct = Math.min(100, Math.round((filled / (gridSize * gridSize)) * 100));
  document.getElementById('pipeVal').textContent = pct + "%";
}

function render() {
  const width = LOGICAL_RESOLUTION;
  const cellSize = width / gridSize;
  ctx.clearRect(0, 0, width, width);

  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2.5;
  for (let i = 0; i <= gridSize; i++) {
    ctx.beginPath(); ctx.moveTo(i * cellSize, 0); ctx.lineTo(i * cellSize, width); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * cellSize); ctx.lineTo(width, i * cellSize); ctx.stroke();
  }

  for (const [colStr, path] of Object.entries(paths)) {
    if (path.length <= 1) continue;
    const colorId = parseInt(colStr);
    const colDef = getColor(colorId);

    ctx.beginPath();
    for (let i = 0; i < path.length; i++) {
      const x = (path[i].c + 0.5) * cellSize;
      const y = (path[i].r + 0.5) * cellSize;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = colDef.hex;
    ctx.shadowColor = colDef.hex;
    ctx.shadowBlur = 18;
    ctx.lineWidth = cellSize * 0.44;
    ctx.stroke();

    ctx.beginPath();
    for (let i = 0; i < path.length; i++) {
      const x = (path[i].c + 0.5) * cellSize;
      const y = (path[i].r + 0.5) * cellSize;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = cellSize * 0.14;
    ctx.shadowBlur = 0;
    ctx.stroke();
  }

  ctx.shadowBlur = 0;
  const level = LEVELS[currentLvl];
  level.dots.forEach(dot => {
    const colDef = getColor(dot.color);
    const cx = (dot.c + 0.5) * cellSize;
    const cy = (dot.r + 0.5) * cellSize;
    const isDone = completedColors.has(dot.color);

    if (isDone) {
      ctx.beginPath();
      ctx.arc(cx, cy, cellSize * 0.44, 0, Math.PI * 2);
      ctx.fillStyle = colDef.glow;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(cx, cy, cellSize * 0.34, 0, Math.PI * 2);
    ctx.fillStyle = colDef.hex;
    ctx.shadowColor = colDef.hex;
    ctx.shadowBlur = 14;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.arc(cx, cy, cellSize * 0.12, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  });
}

function renderLevelsGrid() {

const $ = id => document.getElementById(id);
const CATS = ["Arcade","Corrida","Puzzle","Tiro","Plataforma","Outros"];
const EMO = {Arcade:"🕹️", Corrida:"🏎️", Puzzle:"🧩", Tiro:"🚀", Plataforma:"🍄", Outros:"🎲"};
const PROMPT = "Crie um jogo arcade completo em UM ÚNICO arquivo HTML (HTML, CSS e JavaScript juntos, sem bibliotecas externas). Deve funcionar no celular (toque) e no computador (setas + espaço), usar canvas, ter placar, game over e botão de reiniciar. Ao terminar cada partida, chame window.reportScore(pontos) para enviar ao ranking. Responda apenas com o código dentro de um bloco de código.";
const INJ = '<script>(function(){window.reportScore=function(n){parent.postMessage({rc:"score",v:+n},"*")};addEventListener("message",function(e){var d=e.data;if(!d||d.rc!=="key")return;var ev=new KeyboardEvent(d.type,{key:d.key,code:d.code,bubbles:true});try{Object.defineProperty(ev,"keyCode",{get:function(){return d.kc}});Object.defineProperty(ev,"which",{get:function(){return d.kc}})}catch(x){}document.dispatchEvent(ev)})})()<\/script>';

$("pr").value = PROMPT;
$("ct").innerHTML = CATS.map(c=>`<option>${c}</option>`).join("");

const LS = (k,d) => { try{ return JSON.parse(localStorage.getItem(k)) ?? d } catch(e){ return d } };
const LSW = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)) } catch(e){} };

let cloudGames = [];
let scores = LS("rcjogos_scores", []);
let favs = LS("rcjogos_favs", []);
let cat = "Todos", cur = null, pad = false;

const hue = s => [...s].reduce((a,c)=>a*31+c.charCodeAt(0),7) % 360;

function getAllGames() {
  return [...cloudGames, ...SEED];
}

function chips() {
  const w = $("chips"); w.textContent = "";
  ["Todos","★ Favoritos",...CATS].forEach(c => {
    const b = document.createElement("button");
    b.textContent = c;
    b.className = cat === c ? "on" : "g";
    b.onclick = () => { cat = c; render(); };
    w.append(b);
  });
}

function render() {
  chips();
  const L = $("list"); L.textContent = "";
  const q = $("q").value.toLowerCase();
  const arr = getAllGames().filter(g => (cat==="Todos" || (cat==="★ Favoritos"?favs.includes(g.id):g.cat===cat)) && (g.name+" "+(g.desc||"")).toLowerCase().includes(q));
  
  $("empty").style.display = arr.length ? "none" : "block";

  arr.forEach(g => {
    const c = document.createElement("div"); c.className = "card";
    const cv = document.createElement("div"); cv.className = "cv";
    cv.style.background = `linear-gradient(135deg,hsl(${hue(g.name)},70%,45%),hsl(${(hue(g.name)+60)%360},70%,30%))`;
    cv.textContent = EMO[g.cat] || "🕹️";

    const b = document.createElement("div"); b.className = "cb";
    const n = document.createElement("b"); n.textContent = g.name;
    const t = document.createElement("div"); t.className = "tag"; t.textContent = g.cat || "Outros";
    const d = document.createElement("div"); d.className = "ds"; d.textContent = g.desc || "";
    const r = document.createElement("div"); r.className = "row sp";
    
    const mk = (x, f, cl) => {
      const e = document.createElement("button");
      e.textContent = x;
      if (cl) e.className = cl;
      e.onclick = f;
      r.append(e);
    };

    mk("Jogar", () => play(g));
    mk(favs.includes(g.id) ? "★" : "☆", () => fav(g.id), "g");
    mk("🏆", () => rank(g), "g");
    if (!g.builtin) {
      mk("🗑", () => del(g), "g");
    }

    b.append(n, t);
    if (g.desc) b.append(d);
    b.append(r);
    c.append(cv, b);
    L.append(c);
  });
}

function fav(id) {
  favs = favs.includes(id) ? favs.filter(x=>x!==id) : [...favs, id];
  LSW("rcjogos_favs", favs);
  render();
}

$("q").oninput = render;

function build(h) {
  return /<head[^>]*>/i.test(h) ? h.replace(/<head[^>]*>/i, m => m + INJ) : INJ + h;
}

function play(g) {
  cur = g;
  $("pt").textContent = g.name;
  $("fr").srcdoc = build(g.html);
  $("player").classList.add("on");
  document.body.classList.add("lock");
  // O Cyberflow usa toque nativo na tela, logo não precisa do D-Pad arcade cobrindo
  pad = (g.id !== "builtin-cyberflow" && "ontouchstart" in window);
  $("pad").classList.toggle("on", pad);
}

function closeP() {
  $("player").classList.remove("on");
  document.body.classList.remove("lock");
  $("fr").srcdoc = "";
  cur = null;
}

$("close").onclick = closeP;
$("fs").onclick = () => {
  const e = $("fr");
  (e.requestFullscreen || e.webkitRequestFullscreen || function(){}).call(e);
};
$("ctl").onclick = () => {
  pad = !pad;
  $("pad").classList.toggle("on", pad);
};

// Controles virtuais na tela
document.querySelectorAll("#pad button").forEach(b => {
  const s = t => {
    $("fr").contentWindow.postMessage({
      rc: "key",
      type: t,
      key: b.dataset.k,
      code: b.dataset.k === " " ? "Space" : b.dataset.k,
      kc: +b.dataset.c
    }, "*");
  };
  b.addEventListener("pointerdown", e => { e.preventDefault(); s("keydown"); });
  ["pointerup","pointercancel","pointerleave"].forEach(ev => b.addEventListener(ev, () => s("keyup")));
});

// Receptor de pontuações enviadas pelo jogo (postMessage)
addEventListener("message", e => {
  const d = e.data;
  if (cur && e.source === $("fr").contentWindow && d && d.rc === "score") {
    saveScore(cur, Math.floor(d.v));
  }
});

function saveScore(g, v) {
  if (!isFinite(v) || v <= 0) return;
  let name = prompt(`🏆 Novo recorde no jogo ${g.name}!\nPontos: ${v}\nDigite seu Apelido / Nick:`);
  name = (name || "").trim().slice(0, 20) || "Jogador Anônimo";
  
  scores.push({ gid: g.id, name: name, best: v, t: Date.now() });
  scores.sort((a,b) => b.best - a.best);
  LSW("rcjogos_scores", scores);

  fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: 'salvar_score',
      gameId: g.id,
      gameTitle: g.name,
      player: name,
      score: v
    })
  }).catch(()=>{});

  alert("Pontuação de " + v + " pontos registrada com sucesso!");
}

function rank(g) {
  const top = scores.filter(s => s.gid === g.id).sort((a,b) => b.best - a.best).slice(0, 10);
  const b = $("rkb"); b.textContent = "";
  const h = document.createElement("b"); h.textContent = "🏆 " + g.name; b.append(h);

  if (!top.length) {
    const p = document.createElement("p"); p.className = "mu"; p.textContent = "Sem pontuações ainda. Jogue e seja o primeiro!";
    b.append(p);
  } else {
    const o = document.createElement("ol");
    top.forEach(s => {
      const l = document.createElement("li");
      l.textContent = s.name + " — " + s.best + " pts";
      o.append(l);
    });
    b.append(o);
  }

  const x = document.createElement("button");
  x.textContent = "Fechar";
  x.onclick = () => $("rk").classList.remove("on");
  b.append(x);
  $("rk").classList.add("on");
}

$("rk").onclick = e => { if (e.target === $("rk")) $("rk").classList.remove("on"); };

$("addb").onclick = () => $("addp").classList.toggle("on");
$("cancel").onclick = () => $("addp").classList.remove("on");

$("cp").onclick = async () => {
  try {
    await navigator.clipboard.writeText(PROMPT);
    $("cp").textContent = "Copiado!";
    setTimeout(() => $("cp").textContent = "Copiar prompt", 2000);
  } catch(e) {
    $("pr").select();
  }
};

$("file").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  $("code").value = await f.text();
  if (!$("nm").value) $("nm").value = f.name.replace(/\.html?$/i, "");
};

$("test").onclick = () => {
  const h = $("code").value.trim();
  if (h.length < 20) { $("msg").textContent = "Cole o código HTML primeiro."; return; }
  cur = { id: "test", name: $("nm").value || "Teste Local", html: h };
  play(cur);
};

// Carregar jogos do Google Drive
async function carregarJogosNuvem() {
  try {
    const res = await fetch(SCRIPT_URL + "?action=listar");
    const data = await res.json();
    if (data.sucesso && Array.isArray(data.jogos)) {
      cloudGames = data.jogos.map(j => ({
        id: j.id,
        name: j.title,
        cat: j.category || "Arcade",
        desc: j.desc || "",
        html: j.code,
        builtin: false
      }));
      render();
    }
  } catch (err) {
    console.warn("Falha ao comunicar com o Google Drive:", err);
  }
}

// Salvar jogo no Google Drive
$("save").onclick = async () => {
  const name = $("nm").value.trim(), html = $("code").value.trim();
  if (!name || html.length < 20) { $("msg").textContent = "Informe o nome e o código HTML."; return; }

  const btn = $("save");
  btn.disabled = true;
  btn.textContent = "A enviar à nuvem...";

  const safeFileName = name.toLowerCase().replace(/[^a-z0-9]/g, '_') + '.html';
  const base64Content = 'data:text/html;charset=utf-8,' + encodeURIComponent(html);

  const payload = {
    nome: safeFileName,
    tipoMime: 'text/html',
    conteudo: base64Content,
    titulo: name,
    autor: 'Dev',
    categoria: $("ct").value,
    desc: $("ds").value.trim().slice(0, 90)
  };

  try {
    const response = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    const res = await response.json();
    btn.disabled = false;
    btn.textContent = "Salvar na Nuvem";

    if (res.sucesso) {
      alert("Sucesso: Jogo arquivado no Google Drive!");
      ["nm","ds","code","file"].forEach(k => $(k).value = "");
      $("addp").classList.remove("on");
      carregarJogosNuvem();
    } else {
      alert("Erro ao gravar no Drive: " + res.mensagem);
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "Salvar na Nuvem";
    alert("Erro de conexão com o Apps Script.");
  }
};

// Excluir jogo do Google Drive
async function del(g) {
  if (!confirm("Excluir o jogo \"" + g.name + "\" da nuvem de todos os aparelhos?")) return;
  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'excluir', id: g.id })
    });
    const data = await res.json();
    if (data.sucesso) {
      alert("Jogo excluído com sucesso da nuvem!");
      carregarJogosNuvem();
    } else {
      alert("Erro ao excluir: " + data.mensagem);
    }
  } catch (err) {
    alert("Erro de comunicação com o servidor.");
  }
}
